[project]
name = "luminir-dp"
version = "0.2.0"
description = "AI document parsing backend for HWP, HWPX, PDF, spreadsheet, and image workflows."
requires-python = ">=3.12"
dependencies = []

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "models",
    "reports",
]

[tool.ruff.lint]
extend-ignore = [
    # Several entrypoints intentionally load .env before importing app modules.
    "E402",
]

[tool.bandit]
exclude_dirs = ["tests", ".venv", "models", "reports"]

[tool.ruff.lint.per-file-ignores]
# This branch still has unreachable legacy HWP processing code after an early return.
"core/pipeline.py" = ["F821"]
